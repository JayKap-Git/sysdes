name: Build & deploy site

# Builds the MkDocs site and publishes it to the gh-pages branch.
# GitHub Pages serves gh-pages; docs/CNAME sets the custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build (strict) and publish to gh-pages
        run: mkdocs gh-deploy --strict --force --no-history
