site_name: SysDes — System Design, Deeply
site_description: >-
  A deep, bilingual (English + Hinglish) system design learning companion,
  built around Alex Xu's "System Design Interview – An Insider's Guide".
site_author: Jayant Kapoor
site_url: https://sysdes.jayantkapoor.com/
repo_url: https://github.com/JayKap-Git/sysdes
repo_name: JayKap-Git/sysdes
edit_uri: edit/main/docs/
copyright: >-
  Notes &amp; diagrams by Jayant Kapoor · Companion to Alex Xu's
  <em>System Design Interview</em> — please buy the book to support the author.

theme:
  name: material
  language: en
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/sitemap-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: hi
          name: Hinglish
          build: true
          site_name: SysDes — System Design, Gehraai se
          theme:
            language: en
          nav_translations:
            Home: Home
            Start Here: Yahan se shuru karo
            Foundations: Foundations (Neev)
            "01 · Scale from Zero to Millions": "01 · Zero se Millions tak Scale"
            "02 · Back-of-the-Envelope Estimation": "02 · Back-of-the-Envelope Estimation"
            "03 · The Interview Framework": "03 · Interview ka Framework"
            Building Blocks: Building Blocks
            "04 · Rate Limiter": "04 · Rate Limiter"
            "05 · Consistent Hashing": "05 · Consistent Hashing"
            "06 · Key-Value Store": "06 · Key-Value Store"
            "07 · Unique ID Generator": "07 · Unique ID Generator"
            Case Studies: Case Studies
            "08 · URL Shortener": "08 · URL Shortener"
            "09 · Web Crawler": "09 · Web Crawler"
            "10 · Notification System": "10 · Notification System"
            "11 · News Feed": "11 · News Feed"
            "12 · Chat System": "12 · Chat System"
            "13 · Search Autocomplete": "13 · Search Autocomplete"
            "14 · YouTube": "14 · YouTube"
            "15 · Google Drive": "15 · Google Drive"
            Revise & Beyond: Revision & Aage
            "16 · Revision Cheat Sheet": "16 · Revision Cheat Sheet"
            "17 · Glossary": "17 · Glossary (Shabdkosh)"
            "18 · The Learning Continues": "18 · Seekhna Jaari Hai"

nav:
  - Home: index.md
  - Start Here: start-here.md
  - Foundations:
      - "01 · Scale from Zero to Millions": foundations/01-scale-from-zero-to-millions.md
      - "02 · Back-of-the-Envelope Estimation": foundations/02-back-of-the-envelope.md
      - "03 · The Interview Framework": foundations/03-interview-framework.md
  - Building Blocks:
      - "04 · Rate Limiter": building-blocks/04-rate-limiter.md
      - "05 · Consistent Hashing": building-blocks/05-consistent-hashing.md
      - "06 · Key-Value Store": building-blocks/06-key-value-store.md
      - "07 · Unique ID Generator": building-blocks/07-unique-id-generator.md
  - Case Studies:
      - "08 · URL Shortener": case-studies/08-url-shortener.md
      - "09 · Web Crawler": case-studies/09-web-crawler.md
      - "10 · Notification System": case-studies/10-notification-system.md
      - "11 · News Feed": case-studies/11-news-feed.md
      - "12 · Chat System": case-studies/12-chat-system.md
      - "13 · Search Autocomplete": case-studies/13-search-autocomplete.md
      - "14 · YouTube": case-studies/14-youtube.md
      - "15 · Google Drive": case-studies/15-google-drive.md
  - Revise & Beyond:
      - "16 · Revision Cheat Sheet": revise/16-cheat-sheet.md
      - "17 · Glossary": revise/17-glossary.md
      - "18 · The Learning Continues": revise/18-learning-continues.md

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://jayantkapoor.com
      name: jayantkapoor.com
    - icon: fontawesome/brands/github
      link: https://github.com/JayKap-Git

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/widgets.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
